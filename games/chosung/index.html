<!doctype html>
<html lang="ko" class="intro" data-screen="title">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="description" content="초성 두 글자에 맞는 단어를 계속 입력하는 생존 게임" />
    <title>ㄱㅅ 초성게임</title>
    <meta name="theme-color" content="#0c0a09" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chosung.uzun-choi.com/" />
    <meta property="og:title" content="ㄱㅅ 초성게임" />
    <meta property="og:description" content="초성 두 글자에 맞는 단어를 계속 입력하는 생존 게임" />
    <meta property="og:image" content="https://chosung.uzun-choi.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/fonts.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 첫 화면 배경의 원고지 격자. 줄은 intro.ts가 화면 크기에 맞춰 그린다 -->
    <svg id="paper" aria-hidden="true"></svg>
    <!-- 시작 연출: 앱 시작 화면과 같은 원고지 두 칸 -->
    <div id="intro" aria-hidden="true">
      <svg class="cells" viewBox="0 0 720 360">
        <rect x="0" y="0" width="720" height="360" />
        <line x1="360" y1="0" x2="360" y2="360" />
        <text x="180" y="336">ㄱ</text>
        <text x="540" y="336">ㅅ</text>
      </svg>
    </div>
    <div class="page">
      <header class="top">
        <p class="crumb">
          <a href="https://uzun-choi.com">uzun-choi.com</a> / <strong>ㄱㅅ 초성게임</strong>
        </p>
      </header>

      <section id="title" class="screen split">
        <div class="col hero">
          <p class="kicker mono">No.02 — 초성 게임</p>
          <h1 class="logo" aria-label="ㄱㅅ"><span>ㄱ</span><span>ㅅ</span></h1>
        </div>
        <div class="col">
          <p class="lead">초성 두 글자에 맞는 단어를<br />시간이 다 될 때까지 계속 입력하세요.</p>
          <ul class="rules">
            <li><b class="mono">+3s</b> 정답</li>
            <li><b class="mono">−1s</b> 사전에 없는 말</li>
            <li><b class="mono">×2</b> 갈수록 빨라짐</li>
          </ul>
          <div class="start-row">
            <button id="start" class="btn primary" type="button">시작 →</button>
            <p id="title-best" class="meta" hidden></p>
          </div>
          <p id="title-error" class="meta" role="alert" hidden></p>
        </div>
      </section>

      <section id="game" class="screen" hidden>
        <div class="timer wide" id="timer">
          <div class="timer-bar"><span id="timer-fill"></span></div>
          <span id="timer-num" class="timer-num mono">15.0</span>
        </div>
        <div class="col stage">
          <div class="stage-labels">
            <span>초성</span>
            <span id="count" class="mono">0단어</span>
          </div>
          <div class="pair" id="pair" aria-live="off"></div>
        </div>
        <div class="col entry-col">
          <div class="entry-block">
            <form id="form" class="entry" autocomplete="off">
              <input
                id="input"
                type="text"
                lang="ko"
                aria-label="단어 입력"
                placeholder="단어 입력"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                enterkeyhint="send"
              />
              <button id="submit" class="btn primary" type="button">입력</button>
            </form>
            <p id="feedback" class="feedback" aria-live="polite"></p>
          </div>
          <ul id="chips" class="chips"></ul>
        </div>
        <div id="paused" class="paused" hidden>
          <p>일시정지</p>
          <button id="resume" class="btn primary" type="button">계속하기</button>
        </div>
      </section>

      <section id="result" class="screen split" hidden>
        <div class="col">
          <div class="result-head">
            <p class="kicker mono">결과</p>
            <h1 class="result-title">
              <span id="r-pair" class="r-pair"></span>
              <span class="score"><span id="r-score" class="mono">0</span>단어</span>
            </h1>
            <p class="meta">
              <span id="r-best"></span>
              <span id="r-record" class="tag solid" hidden>신기록</span>
            </p>
          </div>

          <div class="actions" role="group" aria-label="다음 행동">
            <button id="again" class="seg primary" type="button">다시하기</button>
            <button id="same" class="seg" type="button">같은 초성으로</button>
            <button id="share" class="seg" type="button">공유</button>
          </div>
        </div>

        <div class="col">
          <div class="group">
            <h2 class="section-title">찾은 단어</h2>
            <ul id="r-found" class="chips"></ul>
          </div>

          <div class="group">
            <h2 id="r-missed-title" class="section-title">이런 단어도 있었어요</h2>
            <ul id="r-missed" class="chips missed"></ul>
            <p id="r-coverage" class="meta"></p>
          </div>
        </div>
      </section>

      <footer class="credit">
        사전: 국립국어원 우리말샘·표준국어대사전·한국어기초사전 ·
        <a href="https://creativecommons.org/licenses/by-sa/2.0/kr/">CC BY-SA 2.0 KR</a>
        <br />
        <!-- 전체 주소: 앱에서는 웹뷰 밖(Safari)으로 연다 -->
        <a href="https://chosung.uzun-choi.com/support.html">도움말</a> ·
        <a href="https://chosung.uzun-choi.com/privacy.html">개인정보 처리방침</a>
      </footer>

      <p id="toast" class="toast" role="status"></p>
    </div>

    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
